name = "secretforge-api"
main = "src/index.ts"
workers_dev = true
node_compat = true

[observability]
enabled = true

# D1 Database for metadata
[[d1_databases]]
binding = "DATABASE"
database_name = "secretforge-db"
database_id = "83cce8ad-9f2e-404f-9ada-943849e14efe"

# KV for encrypted secrets storage
[[kv_namespaces]]
binding = "SECRETS_VAULT"
id = "b71460ab4b6447b2924b56080365d3c4"
# KV for rate limiting
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "f044969427384382b43af253ec64e41c"
# Vectorize for API documentation search
[[vectorize]]
binding = "VECTOR_DB"
index_name = "api-docs-index"

# Agents for stateful AI workflows
[[agents]]
binding = "SECRET_AGENT"
name = "secret-agent"

[vars]
ENVIRONMENT = "development"

# Secrets (set via wrangler secret put)
# OPENAI_API_KEY
# ANTHROPIC_API_KEY
# ENCRYPTION_KEY (32 bytes base64)
# JWT_SECRET (32+ bytes base64)
# API_KEY_SALT (32 bytes base64)

[env.production]
name = "secretforge-api-production"

[env.production.vars]
ENVIRONMENT = "production"

[build]
command = "pnpm build"

[dev]
port = 8787
